
# ==========================================
# PEDIDOS360 - MICROSERVICIO BFF
# ==========================================

spring.application.name=ms-pedidos360-bff
server.port=8080

# ==========================================
# MICROSOFT ENTRA ID - AUTENTICACION JWT
# ==========================================

# Emisor del Access Token
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://sts.windows.net/a2e6c631-6073-419e-8394-472edc612ecd/

# Audiencia del Access Token de Pedidos360-API
spring.security.oauth2.resourceserver.jwt.audiences=api://238874f0-b1f7-4f4f-b532-32b4e905b728

# ==========================================
# RABBITMQ - EVALUACION 3
# ==========================================

# Conexion al cluster RabbitMQ
spring.rabbitmq.addresses=localhost:5672,localhost:5673,localhost:5674

# Credenciales locales de demostracion
spring.rabbitmq.username=${RABBITMQ_USERNAME:ev3admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:ev3_local_demo}

# ==========================================
# EVENTOS DE PEDIDOS
# ==========================================

# Exchange principal
pedidos360.rabbit.exchange=pedidos360.events

# Routing key para pedidos creados
pedidos360.rabbit.routing-key=order.created

# ==========================================
# LOGS Y DIAGNOSTICOS
# ==========================================

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG
logging.level.com.pedidos360.bff=INFO
